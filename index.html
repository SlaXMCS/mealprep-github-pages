<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Prep 4/2 Planner</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Meal Prep 4/2 Planner</h1>
</header>

<main>
  <section class="menu">
    <h2>Menu Rotativo</h2>
    <label for="ciclo-select">Selecionar Ciclo:</label>
    <select id="ciclo-select"></select>
    <div id="menu-days"></div>
  </section>

  <section class="recipes">
    <h2>Receitas</h2>
    <div id="recipes-list"></div>
  </section>

  <section class="shopping">
    <h2>Lista de Compras</h2>
    <ul id="shopping-list"></ul>
  </section>

  <section class="chat">
    <h2>Chat IA</h2>
    <div id="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="chat-input" placeholder="Pergunta à IA...">
      <button id="chat-send">Enviar</button>
    </div>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
