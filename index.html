<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Prep Planner 2026 - Advanced</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative overflow-x-hidden bg-gray-50">

<div id="background"></div>

<div class="container mx-auto p-6 relative z-10">

  <h1 class="text-5xl font-extrabold text-center mb-8 text-gradient">Meal Prep Planner 2026</h1>

  <!-- Controles -->
  <div id="controls" class="bg-white/90 backdrop-blur-md rounded-xl shadow-lg p-6 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">

    <div class="flex flex-col gap-3">
      <label>
        Proteína favorita:
        <select id="proteina" class="border rounded px-3 py-2 w-full mt-1">
          <option value="frango">Frango</option>
          <option value="porco">Porco</option>
          <option value="vaca">Vaca</option>
          <option value="ovos">Ovos</option>
          <option value="leguminosas">Leguminosas</option>
        </select>
      </label>
      <label>
        Evitar ingredientes (vírgula separado):
        <input type="text" id="evitar" class="border rounded px-3 py-2 w-full mt-1" placeholder="Ex: peixe, marisco"/>
      </label>
      <label>
        Número de porções padrão:
        <input type="number" id="porcoes" class="border rounded px-3 py-2 w-full mt-1" value="1" min="1"/>
      </label>
    </div>

    <div class="flex flex-col gap-3">
      <label>
        Filtros de refeição:
        <select id="filtro" class="border rounded px-3 py-2 w-full mt-1">
          <option value="todos">Todos</option>
          <option value="rapido">Rápido</option>
          <option value="forno">Forno</option>
          <option value="vegetariano">Vegetariano</option>
        </select>
      </label>
      <button id="gerarMenus" class="bg-gradient-to-r from-green-400 to-blue-400 text-white px-6 py-3 rounded-xl font-semibold shadow-lg hover:scale-105 transition-all duration-300">Gerar Menus 6 Dias</button>
      <button id="modoCozinha" class="bg-gradient-to-r from-purple-400 to-pink-400 text-white px-6 py-3 rounded-xl font-semibold shadow-lg hover:scale-105 transition-all duration-300">Modo Cozinha</button>
    </div>

  </div>

  <!-- Menus -->
  <div id="menusContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6"></div>

  <!-- Lista de compras -->
  <div id="comprasContainer" class="mb-6 bg-white/90 backdrop-blur-md rounded-xl shadow-lg p-6"></div>

  <!-- Assistente / Calculadora -->
  <div id="assistenteContainer" class="bg-white/90 backdrop-blur-md rounded-xl shadow-lg p-6">
    <h2 class="text-2xl font-semibold mb-4">Assistente / Calculadora</h2>
    <input type="text" id="iaPergunta" placeholder="Ex: dobrar receita ou para 3 pessoas" class="border rounded px-3 py-2 w-full mb-3"/>
    <button id="iaButton" class="bg-gradient-to-r from-blue-400 to-purple-400 text-white px-4 py-2 rounded-xl w-full mb-3 hover:scale-105 transition-all duration-300">Calcular</button>
    <pre id="iaResposta" class="whitespace-pre-wrap bg-gray-50 p-4 rounded-xl shadow-inner"></pre>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
